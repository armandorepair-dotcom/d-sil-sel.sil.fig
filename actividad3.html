<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chispa Didáctica - Sílabas con D (PWA)</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0EA5E9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sílabas D">

  <!-- Diseño e ilustraciones integrados, sin recursos externos. -->
  <style>
    :root { color-scheme: light; font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', system-ui, sans-serif; color: #123653; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 20px; display: flex; flex-direction: column; gap: 18px; align-items: center; background: radial-gradient(ellipse at 10% 5%, #fff 0%, transparent 45%), linear-gradient(145deg, #e6f8ff, #b7e9fc 55%, #75caef); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    button:focus-visible { outline: 4px solid #8b5cf6; outline-offset: 4px; }
    button:disabled { cursor: default; }
    svg { display: block; }
    .app-header, main, .app-footer { width: min(100%, 1180px); position: relative; z-index: 1; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 20px; background: #fffffff0; border: 2px solid #fff; border-radius: 26px; box-shadow: 0 8px 25px #08638612; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 54px; height: 54px; flex-shrink: 0; display: grid; place-items: center; border-radius: 18px; background: linear-gradient(145deg, #31bfee, #0576bb); color: #fff; font-size: 37px; font-weight: 900; box-shadow: inset 0 2px 0 #ffffff66, 0 4px 0 #075f8e; }
    h1 { margin: 0; font-size: clamp(20px, 2.5vw, 28px); line-height: 1.18; font-weight: 900; letter-spacing: -.6px; }
    .brand p { margin: 5px 0 0; color: #39738d; font-size: 14px; }
    .header-actions { display: flex; align-items: center; gap: 9px; }
    .action-btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; border: 2px solid #f3ba23; border-radius: 16px; padding: 12px 15px; color: #684300; background: #ffdf6b; font-weight: 800; box-shadow: 0 3px 0 #e4b948; transition: transform .18s; }
    .action-btn svg { width: 24px; height: 24px; flex-shrink: 0; }
    .action-btn:active, #reiniciar:active { transform: translateY(2px); }
    #motionBtn { background: #e9f6ff; border-color: #b5def0; color: #235778; box-shadow: 0 3px 0 #b5def0; padding: 12px; }
    #motionBtn[aria-pressed='true'] { background: #f3efff; border-color: #bfa9ec; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
    .target-panel { display: flex; justify-content: center; align-items: center; gap: 26px; text-align: left; background: #fffffff2; padding: 14px 32px; border: 3px solid #fff; border-radius: 27px; box-shadow: 0 8px 25px #08638612; }
    .target-copy { display: grid; gap: 5px; }
    .target-copy strong { font-size: 19px; line-height: 1.25; }
    .target-copy span { color: #41738b; font-size: 13px; }
    #silaba { min-width: 110px; text-align: center; color: #086da9; font-size: clamp(60px, 8vw, 84px); line-height: 1; font-weight: 950; letter-spacing: 2px; text-shadow: 0 4px 0 #d4f0ff; }
    #figuras { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; width: 100%; padding: 12px 3px; align-items: start; }
    .item { --card-color: #e0f2fe; position: relative; display: grid; place-items: center; min-width: 0; width: 100%; aspect-ratio: 1; padding: 3px; border: 4px solid #fff; border-radius: 29px; background: radial-gradient(ellipse at 45% 30%, #ffffffed, var(--card-color) 90%); box-shadow: 0 6px 0 #5998b426, 0 9px 20px #0766901a; isolation: isolate; }
    .item::before { content: ''; position: absolute; inset: 7px; border: 1px solid #ffffffb3; border-radius: 20px; z-index: -1; }
    .card-bounce { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    @media (hover:hover) { .card-bounce:hover { transform: translateY(-6px); box-shadow: 0 9px 0 #5998b420, 0 15px 25px #07669024; } }
    .card-bounce:active { transform: scale(.97); }
    .cardin { display: block; width: 100%; height: 100%; pointer-events: none; animation: cardIn .4s ease-out both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
    .fig { width: 100%; height: 100%; overflow: hidden; }
    .fig .outline { stroke: #243f57; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .fig .detail { fill: none; stroke: #243f57; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .fig .shine { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: .7; }
    .fig .float { transform-box: view-box; transform-origin: 120px 120px; animation: float 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .fig .rock { transform-box: view-box; transform-origin: 120px 178px; animation: rock 3.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .fig .swim { transform-box: view-box; transform-origin: 120px 120px; animation: swim 3.6s ease-in-out infinite; }
    .fig .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; animation-delay: var(--d, 0s); }
    .fig .leaf { transform-box: fill-box; transform-origin: 15% 95%; animation: leaf 3s ease-in-out infinite; }
    .fig .fin { transform-box: fill-box; transform-origin: 15% 25%; animation: fin 2s ease-in-out infinite; }
    .fig .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .fig .flower { transform-box: view-box; transform-origin: 120px 120px; animation: flower 5s ease-in-out infinite; }
    .fig .hello { transform-box: view-box; transform-origin: 179px 142px; animation: hello 3.6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes rock { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes swim { 0%,100% { transform: translate(-2px,2px) rotate(-2deg); } 50% { transform: translate(3px,-4px) rotate(2deg); } }
    @keyframes blink { 0%,92%,97%,100% { transform: scaleY(1); } 94%,95% { transform: scaleY(.08); } }
    @keyframes leaf { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes fin { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(8deg); } }
    @keyframes twinkle { 0%,100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes flower { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes hello { 0%,55%,100% { transform: rotate(0); } 65%,85% { transform: rotate(-9deg); } 75%,95% { transform: rotate(4deg); } }
    .animate-syllable { animation: targetPulse 4s ease-in-out infinite; }
    @keyframes targetPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    .animate-pop { animation: popSuccess .45s ease-out; }
    @keyframes popSuccess { 50% { transform: translateY(-5px) scale(1.04); } }
    .animate-shake { animation: shakeError .4s ease-in-out; }
    @keyframes shakeError { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
    .item.border-sky-400 { border-color: #0eae85; }
    .item.border-rose-400 { border-color: #ef6b87; }
    #feedbackText { min-height: 30px; text-align: center; margin: 0; font-size: clamp(18px, 3vw, 24px); font-weight: 900; transition: opacity .2s; opacity: 0; }
    .text-sky-600 { color: #087b68; }
    .text-rose-600 { color: #b32c55; }
    .app-footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 20px; background: #fffffff0; border: 2px solid #fff; border-radius: 25px; box-shadow: 0 8px 25px #08638612; }
    #status { display: flex; flex-wrap: wrap; gap: 10px; }
    .stat { display: flex; align-items: center; gap: 9px; background: #e5f5fd; padding: 9px 13px; border-radius: 15px; border: 1px solid #c5e7f7; }
    .stat-icon { font-size: 25px; }
    .stat small { display: block; font-size: 11px; line-height: 1.2; color: #47738a; font-weight: 700; }
    .stat strong { font-size: 22px; line-height: 1.15; }
    .stat-errors { background: #fff0f3; border-color: #f9dae2; }
    .stat-round { background: #f1ecff; border-color: #e1d8fb; }
    .stat-round strong { font-size: 16px; }
    .footer-brand { font-size: 12px; color: #4d7e93; text-align: center; line-height: 1.6; }
    .footer-brand strong { display: block; font-size: 13px; color: #25627d; }
    #reiniciar { display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; border: 2px solid #087cad; border-radius: 16px; padding: 13px 18px; background: linear-gradient(135deg, #1198cc, #0871a6); color: #fff; box-shadow: 0 3px 0 #075c83; font-weight: 800; }
    #reiniciar svg { width: 21px; height: 21px; }
    .results { grid-column: 1 / -1; padding: 30px; border: 3px solid white; border-radius: 28px; background: #fffffff2; text-align: center; box-shadow: 0 8px 25px #08638612; }
    .results h2 { margin: 0 0 12px; font-size: 32px; }
    .results p { font-size: 18px; }
    .results-score { display: inline-block; background: #e9f7ff; padding: 16px 25px; border-radius: 18px; font-size: 24px; font-weight: 800; }
    canvas#confettiCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }
    #bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .bubble { position: absolute; bottom: -70px; border-radius: 50%; background: #ffffff35; border: 2px solid #ffffff80; animation: rise linear infinite; }
    @keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: .6; } 100% { transform: translate(25px,-115vh); opacity: 0; } }
    .motion-paused *, .motion-paused *::before { animation-play-state: paused !important; }
    @media (min-width: 621px) and (max-width: 1000px) {
      #figuras { grid-template-columns: repeat(6, minmax(0,1fr)); max-width: 820px; }
      .item { grid-column: span 2; }
      .item:nth-child(4) { grid-column: 2 / span 2; }
      .item:nth-child(5) { grid-column: 4 / span 2; }
      .footer-brand { display: none; }
    }
    @media (max-width: 620px) {
      body { padding: 12px; gap: 14px; }
      .app-header { padding: 13px; border-radius: 21px; gap: 9px; }
      .brand { gap: 10px; }
      .brand-mark { width: 43px; height: 43px; border-radius: 14px; font-size: 31px; }
      h1 { font-size: 20px; }
      .brand p { font-size: 11px; max-width: 150px; line-height: 1.3; }
      .header-actions { gap: 6px; }
      .action-btn, #motionBtn { padding: 10px; border-radius: 13px; }
      .action-btn svg { width: 21px; height: 21px; }
      .action-label { display: none; }
      .target-panel { padding: 11px 20px; width: min(100%, 400px); gap: 20px; border-radius: 23px; }
      .target-copy strong { font-size: 16px; }
      .target-copy span { font-size: 11px; }
      #silaba { font-size: 64px; min-width: 96px; }
      main { gap: 8px; }
      #figuras { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; padding: 9px 2px; max-width: 480px; }
      .item { border-width: 3px; border-radius: 24px; }
      .item:last-child { grid-column: 1 / -1; width: calc((100% - 13px) / 2); justify-self: center; }
      .app-footer { flex-direction: column; gap: 12px; padding: 13px; border-radius: 22px; }
      #status { width: 100%; flex-wrap: nowrap; justify-content: center; gap: 7px; }
      .stat { flex: 1; justify-content: center; padding: 8px; gap: 5px; }
      .stat-icon { font-size: 21px; }
      .stat strong { font-size: 21px; }
      .stat-round strong { font-size: 14px; white-space: nowrap; }
      #reiniciar { width: 100%; padding: 11px; }
      .footer-brand { display: none; }
      #feedbackText { min-height: 26px; }
    }
    @media (max-width: 359px) { body { padding: 9px; } .brand-mark { display: none; } .brand p { max-width: 135px; } .target-panel { padding: 11px 14px; gap: 12px; } .target-copy strong { font-size: 15px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

      delfin: `

      dedal: `

    /* Base de datos de palabras asociadas a DA, DE, DI, DO, DU */

    // Colores pastel de fondo para las tarjetas
    const pastels = ["#FFE4E6", "#E0F2FE", "#FEF9C3", "#EDE9FE", "#DCFCE7", "#FFEDD5", "#FAE8FF"];

    const grid = document.getElementById("figuras");
    const silabaEl = document.getElementById("silaba");
    const aciertosEl = document.getElementById("aciertos");
    const fallasEl = document.getElementById("fallas");
    const rondaNumEl = document.getElementById("rondaNum");
    const reiniciarBtn = document.getElementById("reiniciar");
    const speakTargetBtn = document.getElementById("speakTargetBtn");
    const feedbackText = document.getElementById("feedbackText");

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let aciertos = 0;
    let fallas = 0;
    let intentos = 0;
    let objetivo = "";
    let isProcessing = false;
    const maxIntentos = 20;

    // Burbujas de fondo
    (function crearBurbujas() {
      const cont = document.getElementById("bubbles");
      for (let i = 0; i < 12; i++) {
        const b = document.createElement("span");
        b.className = "bubble";
        const size = 20 + Math.random() * 50;
        b.style.width = b.style.height = size + "px";
        b.style.left = Math.random() * 100 + "vw";
        b.style.animationDuration = 9 + Math.random() * 10 + "s";
        b.style.animationDelay = -Math.random() * 15 + "s";
        cont.appendChild(b);
      }
    })();

    // Confetti Animation Setup
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function triggerCelebration() {
      if (reducedMotion.matches || document.body.classList.contains("motion-paused")) return;
      const colors = ["#FACC15", "#4ADE80", "#38BDF8", "#F472B6", "#C084FC"];
      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 10 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          life: 1
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4;
        p.rotation += p.vRot;
        p.life -= 0.025;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();

        if (p.life <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Voice Speech Synthesis
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        let spokenText = text;
        const normalized = text.toLowerCase().trim();

        // Ajustes fonéticos
        const phoneticMap = { 'da': 'dá', 'de': 'dé', 'di': 'dí', 'do': 'dó', 'du': 'dú' };
        if (phoneticMap[normalized]) spokenText = phoneticMap[normalized];

        const utterance = new SpeechSynthesisUtterance(spokenText);
        utterance.lang = "es-MX";
        utterance.rate = 0.85;
        utterance.pitch = 1.15;
        window.speechSynthesis.speak(utterance);
      }
    }

    function showFeedback(msg, isSuccess) {
      feedbackText.textContent = msg;
      feedbackText.className = isSuccess ? "text-sky-600" : "text-rose-600";
      feedbackText.style.opacity = '1';
      setTimeout(() => { feedbackText.style.opacity = '0'; }, 1300);
    }

    function mostrarFiguras() {
      grid.innerHTML = "";

      const correctas = figuras.filter(f => f.silaba === objetivo);
      const incorrectas = figuras.filter(f => f.silaba !== objetivo);

      const figuraCorrecta = correctas[Math.floor(Math.random() * correctas.length)];
      const seleccionIncorrectas = [...incorrectas].sort(() => 0.5 - Math.random()).slice(0, 4);
      const seleccion = [figuraCorrecta, ...seleccionIncorrectas].sort(() => 0.5 - Math.random());
      const colores = [...pastels].sort(() => 0.5 - Math.random());

      seleccion.forEach((f, i) => {
        const itemBtn = document.createElement("button");
        itemBtn.type = "button";
        itemBtn.setAttribute("aria-label", f.palabra);
        itemBtn.dataset.word = f.palabra;
        itemBtn.className = "item card-bounce";
        itemBtn.style.setProperty("--card-color", colores[i]);

        const wrap = document.createElement("span");
        wrap.className = "cardin";
        wrap.style.animationDelay = (i * 0.09) + "s";
        wrap.innerHTML = figSvg(f.fig, (Math.random() * 1.5).toFixed(2));

        itemBtn.appendChild(wrap);
        itemBtn.onclick = () => verificar(f, itemBtn);
        grid.appendChild(itemBtn);
      });
    }

    function nuevaRonda() {
      isProcessing = false;

      if (intentos >= maxIntentos) {
        silabaEl.textContent = "🎉";
        speak("¡Juego terminado! Excelente trabajo aprendiendo las sílabas con D");
        triggerCelebration();
        showFeedback("¡Juego terminado! 🎉", true);
        grid.innerHTML = `
          <div class="results">
            <h2>¡Felicidades! 🎉</h2>
            <p>Has completado las ${maxIntentos} rondas.</p>
            <div class="results-score">Aciertos: ${aciertos} | Fallas: ${fallas}</div>
          </div>
        `;
        return;
      }

      const silabas = ["da", "de", "di", "do", "du"];
      objetivo = silabas[Math.floor(Math.random() * silabas.length)];
      silabaEl.textContent = objetivo.toUpperCase();
      rondaNumEl.textContent = intentos + 1;

      mostrarFiguras();

      setTimeout(() => { speak(objetivo); }, 250);
    }

    function verificar(figura, cardElement) {
      if (isProcessing || intentos >= maxIntentos) return;
      isProcessing = true;

      intentos++;

      speak(figura.palabra);

      setTimeout(() => {
        if (figura.silaba === objetivo) {
          aciertos++;
          aciertosEl.textContent = aciertos;
          cardElement.style.setProperty("--card-color", "#c9f4df");
          cardElement.classList.add('border-sky-400', 'animate-pop');

          triggerCelebration();
          speak("¡Correcto!");
          showFeedback("¡Correcto! 🌟", true);
        } else {
          fallas++;
          fallasEl.textContent = fallas;
          cardElement.style.setProperty("--card-color", "#ffdce6");
          cardElement.classList.add('border-rose-400', 'animate-shake');

          speak("no, no");
          showFeedback("No, no ❌", false);
        }

        setTimeout(() => { nuevaRonda(); }, 1300);
      }, 700);
    }

    reiniciarBtn.onclick = () => {
      aciertos = 0;
      fallas = 0;
      intentos = 0;
      aciertosEl.textContent = 0;
      fallasEl.textContent = 0;
      nuevaRonda();
    };

    speakTargetBtn.onclick = () => { speak(objetivo); };

    const motionBtn = document.getElementById("motionBtn");
    motionBtn.onclick = () => {
      const paused = document.body.classList.toggle("motion-paused");
      motionBtn.setAttribute("aria-pressed", String(paused));
      motionBtn.setAttribute("aria-label", paused ? "Activar movimientos" : "Pausar movimientos");
      motionBtn.title = paused ? "Activar movimientos" : "Pausar movimientos";
      motionBtn.innerHTML = paused
        ? '<svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4a1 1 0 0 1 1.5-.86l12 8a1 1 0 0 1 0 1.72l-12 8A1 1 0 0 1 7 20Z"/></svg>'
        : '<svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="2"/><rect x="14" y="4" width="4" height="16" rx="2"/></svg>';
      if (paused) particles = [];
    };

    // Start on load
    window.onload = () => { nuevaRonda(); };
  </script>

<script>
/* Enlace con la PWA unificada (no altera el juego) */
(function(){
  var orig = nuevaRonda, enviado = false;
  nuevaRonda = function(){
    orig();
    if (intentos >= maxIntentos && !enviado) {
      enviado = true;
      setTimeout(function(){ parent.postMessage({tipo:'fin', actividad:3, fallas:fallas, aciertos:aciertos}, '*'); }, 3000);
    }
  };
})();
</script>
</body>
</html>
