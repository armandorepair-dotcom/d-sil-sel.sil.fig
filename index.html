<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sílabas">
  <meta name="description" content="Aventura de sílabas con L, P y D: tres actividades educativas para niños. PWA instalable y compatible offline.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Aventura de Sílabas L, P y D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e0f2fe; font-family: 'Fredoka', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

    /* Barra de progreso */
    #bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 12px; padding-top: calc(7px + env(safe-area-inset-top)); background: #fff; border-bottom: 2px solid #bae6fd; z-index: 5; }
    #bar .title { font-weight: 700; font-size: 14px; color: #075985; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #steps { display: flex; gap: 8px; align-items: center; }
    .step { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #94a3b8; }
    .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #e2e8f0; color: #64748b; font-size: 13px; font-weight: 800; transition: all .25s; }
    .step.activo .dot { background: #0284c7; color: #fff; box-shadow: 0 0 0 4px #bae6fd; }
    .step.activo { color: #0369a1; }
    .step.hecho .dot { background: #22c55e; color: #fff; }
    .step.hecho { color: #16a34a; }
    .line { width: 14px; height: 3px; border-radius: 2px; background: #cbd5e1; }
    @media (max-width: 480px) { .step span.lbl { display: none; } #bar .title { font-size: 13px; } }

    #stage { position: relative; flex: 1 1 auto; min-height: 0; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f0f9ff; }

    /* Pantallas intermedias */
    .overlay { position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 23, 42, .62); backdrop-filter: blur(4px); }
    .overlay.on { display: flex; }
    .card { width: min(100%, 380px); background: #fff; border-radius: 28px; padding: 28px 24px; text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,.35); animation: pop .45s ease-out; }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 80% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
    .emoji { font-size: 64px; line-height: 1; margin-bottom: 8px; }
    .card h2 { margin: 0 0 8px; font-size: 28px; color: #0f172a; }
    .card p { margin: 0 0 18px; font-size: 17px; color: #475569; line-height: 1.35; }
    .score { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .score div { background: #f1f5f9; border-radius: 16px; padding: 8px 18px; }
    .score small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #64748b; font-weight: 700; }
    .score strong { font-size: 26px; }
    .score .ok strong { color: #059669; }
    .score .bad strong { color: #e11d48; }
    .btn { width: 100%; border: 0; border-radius: 18px; padding: 15px 18px; font: inherit; font-size: 19px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, #0ea5e9, #4f46e5); box-shadow: 0 5px 0 #1e3a8a; transition: transform .1s; touch-action: manipulation; }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .btn.retry { background: linear-gradient(135deg, #f59e0b, #ea580c); box-shadow: 0 5px 0 #9a3412; }
    .btn.win { background: linear-gradient(135deg, #22c55e, #059669); box-shadow: 0 5px 0 #166534; }

    /* Final */
    #final { background: linear-gradient(145deg, #fef9c3, #fbcfe8 50%, #bae6fd); backdrop-filter: none; }
    #final .card { box-shadow: 0 20px 45px rgba(190, 24, 93, .25); }
    #final h2 { font-size: 32px; color: #be185d; }
    #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }
    #instalar { display: none; margin-top: 12px; background: linear-gradient(135deg, #10b981, #0d9488); box-shadow: 0 5px 0 #065f46; }
  </style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="title" id="titulo">Aventura de Sílabas</div>
    <div id="steps" aria-label="Progreso">
      <div class="step" data-i="1"><div class="dot">1</div><span class="lbl">Sílabas</span></div>
      <div class="line"></div>
      <div class="step" data-i="2"><div class="dot">2</div><span class="lbl">Dado</span></div>
      <div class="line"></div>
      <div class="step" data-i="3"><div class="dot">3</div><span class="lbl">Sílabas D</span></div>
    </div>
  </div>

  <div id="stage">
    <iframe id="frame" title="Actividad" allow="autoplay"></iframe>

    <!-- Resultado intermedio -->
    <div class="overlay" id="ov">
      <div class="card">
        <div class="emoji" id="ov-emoji">🌟</div>
        <h2 id="ov-title">¡Muy bien!</h2>
        <p id="ov-text"></p>
        <div class="score" id="ov-score">
          <div class="ok"><small>Aciertos</small><strong id="ov-ac">0</strong></div>
          <div class="bad"><small>Fallas</small><strong id="ov-fa">0</strong></div>
        </div>
        <button class="btn" id="ov-btn" type="button">Continuar</button>
      </div>
    </div>

    <!-- Pantalla final -->
    <div class="overlay" id="final">
      <div class="card">
        <div class="emoji">🏆</div>
        <h2>¡Felicidades!</h2>
        <p>¡Terminaste todas las actividades! Eres un campeón de las sílabas. 🎉</p>
        <button class="btn win" id="btn-otra" type="button">Jugar otra vez</button>
        <button class="btn" id="instalar" type="button">Instalar app</button>
      </div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
(function () {
  var MAX_FALLAS = 5;                     // más de 5 fallas => repetir
  var ACTIVIDADES = {
    1: { src: 'actividad1.html', titulo: 'Actividad 1 · Sílabas con L, P y D' },
    2: { src: 'actividad2.html', titulo: 'Actividad 2 · Rompecabezas' },
    3: { src: 'actividad3.html', titulo: 'Actividad 3 · Sílabas con D' }
  };
  var actual = 1;
  var frame = document.getElementById('frame');
  var ov = document.getElementById('ov'), fin = document.getElementById('final');
  var $ = function (id) { return document.getElementById(id); };

  function hablar(t) {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'es-MX'; u.rate = 0.9; u.pitch = 1.1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function marcarPasos() {
    document.querySelectorAll('.step').forEach(function (s) {
      var i = +s.dataset.i;
      s.classList.toggle('activo', i === actual);
      s.classList.toggle('hecho', i < actual);
      s.querySelector('.dot').textContent = i < actual ? '✓' : i;
    });
    $('titulo').textContent = ACTIVIDADES[actual] ? ACTIVIDADES[actual].titulo : 'Aventura de Sílabas';
  }

  function cargar(n) {
    actual = n;
    ov.classList.remove('on'); fin.classList.remove('on');
    marcarPasos();
    // se recarga el iframe: la actividad siempre inicia desde cero
    frame.src = ACTIVIDADES[n].src + '?v=' + Date.now();
  }

  function mostrarOverlay(o) {
    $('ov-emoji').textContent = o.emoji;
    $('ov-title').textContent = o.titulo;
    $('ov-text').textContent = o.texto;
    $('ov-score').style.display = o.mostrarPuntos ? 'flex' : 'none';
    $('ov-ac').textContent = o.aciertos || 0;
    $('ov-fa').textContent = o.fallas || 0;
    var b = $('ov-btn');
    b.textContent = o.boton;
    b.className = 'btn ' + (o.clase || '');
    b.onclick = o.accion;
    ov.classList.add('on');
    hablar(o.voz);
  }

  function resultado(n, fallas, aciertos) {
    var pasa = fallas <= MAX_FALLAS;     // "no mayor a 5"
    var puntos = (n !== 2);              // el rompecabezas no tiene fallas
    if (!pasa) {
      mostrarOverlay({
        emoji: '💪', titulo: '¡Inténtalo otra vez!', clase: 'retry', boton: 'Repetir actividad',
        texto: 'Tuviste ' + fallas + ' fallas. Necesitas ' + MAX_FALLAS + ' o menos para avanzar.',
        voz: 'Inténtalo otra vez. Tú puedes.',
        mostrarPuntos: puntos, aciertos: aciertos, fallas: fallas,
        accion: function () { cargar(n); }
      });
      return;
    }
    if (n < 3) {
      mostrarOverlay({
        emoji: n === 1 ? '🌟' : '🧩', titulo: '¡Muy bien!', boton: 'Siguiente actividad ➜',
        texto: n === 1 ? 'Pasaste a la siguiente actividad: ¡el rompecabezas!' : 'Armaste el rompecabezas. ¡Sigue la última actividad!',
        voz: '¡Muy bien! Vamos a la siguiente actividad.',
        mostrarPuntos: puntos, aciertos: aciertos, fallas: fallas,
        accion: function () { cargar(n + 1); }
      });
    } else {
      celebrar();
    }
  }

  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow || !e.data || e.data.tipo !== 'fin') return;
    if (e.data.actividad !== actual) return;
    resultado(actual, +e.data.fallas || 0, +e.data.aciertos || 0);
  });

  /* ---------- Serpentinas y confeti ---------- */
  var cv = $('fx'), cx = cv.getContext('2d'), piezas = [], corriendo = false, fin_t = 0;
  function medir() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', medir); medir();
  var COL = ['#f43f5e', '#f59e0b', '#22c55e', '#0ea5e9', '#a855f7', '#ec4899', '#facc15'];
  function lanzar(x, dir) {
    for (var i = 0; i < 28; i++) {
      var a = (dir === 'l' ? -0.35 : -Math.PI + 0.35) + (Math.random() - .5) * .9;
      var v = 9 + Math.random() * 11;
      piezas.push({ tipo: 's', x: x, y: cv.height * 0.85, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
        len: 40 + Math.random() * 50, w: 5 + Math.random() * 3, fase: Math.random() * 6.28, c: COL[(Math.random() * COL.length) | 0], vida: 1 });
    }
  }
  function lluvia() {
    for (var i = 0; i < 14; i++) {
      piezas.push({ tipo: Math.random() < .5 ? 's' : 'c', x: Math.random() * cv.width, y: -20, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3,
        len: 45 + Math.random() * 45, w: 5 + Math.random() * 3, fase: Math.random() * 6.28, s: 6 + Math.random() * 8, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
        c: COL[(Math.random() * COL.length) | 0], vida: 1, lluvia: true });
    }
  }
  function dibujar() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (var i = piezas.length - 1; i >= 0; i--) {
      var p = piezas[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.lluvia ? 0.03 : 0.32; p.vx *= p.lluvia ? 1 : 0.985; p.fase += .18;
      p.vida -= p.lluvia ? 0.0028 : 0.009;
      cx.globalAlpha = Math.max(0, Math.min(1, p.vida * 1.6));
      if (p.tipo === 's') {              // serpentina ondulada
        cx.strokeStyle = p.c; cx.lineWidth = p.w; cx.lineCap = 'round';
        cx.beginPath();
        for (var k = 0; k <= 10; k++) {
          var t = k / 10;
          cx.lineTo(p.x + Math.sin(p.fase + t * 7) * 9, p.y - (p.vy > 0 ? 1 : -1) * t * p.len);
        }
        cx.stroke();
      } else {                           // confeti
        p.rot = (p.rot || 0) + (p.vr || .2);
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
        cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); cx.restore();
      }
      if (p.vida <= 0 || p.y > cv.height + 120) piezas.splice(i, 1);
    }
    if (performance.now() < fin_t && Math.random() < .35) lluvia();
    if (piezas.length || performance.now() < fin_t) requestAnimationFrame(dibujar);
    else { corriendo = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }
  function celebrar() {
    actual = 4; marcarPasos(); $('titulo').textContent = '¡Aventura completada!';
    document.querySelectorAll('.step').forEach(function (s) { s.classList.remove('activo'); s.classList.add('hecho'); s.querySelector('.dot').textContent = '✓'; });
    ov.classList.remove('on'); fin.classList.add('on');
    hablar('¡Felicidades! Terminaste todas las actividades. ¡Eres un campeón!');
    fin_t = performance.now() + 6000;
    lanzar(0, 'l'); lanzar(cv.width, 'r');
    setTimeout(function () { lanzar(0, 'l'); lanzar(cv.width, 'r'); }, 700);
    setTimeout(function () { lanzar(0, 'l'); lanzar(cv.width, 'r'); }, 1500);
    if (!corriendo) { corriendo = true; requestAnimationFrame(dibujar); }
  }

  $('btn-otra').onclick = function () { piezas = []; cargar(1); };

  /* ---------- PWA ---------- */
  var diferido = null, bi = $('instalar');
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); diferido = e; bi.style.display = 'block'; });
  bi.onclick = function () {
    if (!diferido) return;
    diferido.prompt();
    diferido.userChoice.then(function () { diferido = null; bi.style.display = 'none'; });
  };
  if ('serviceWorker' in navigator) {
    addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  cargar(1);
})();
</script>
</body>
</html>
